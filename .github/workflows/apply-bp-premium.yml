name: Apply premium Brawl Pass rewards
on:
  push:
    paths:
      - 'patch_bp_premium.py'
      - 'bot.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_bp_premium.py
      - run: |
          python3 -m py_compile bot.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git rm patch_bp_premium.py .github/workflows/apply-bp-premium.yml
          git commit -m 'Add rewards alongside premium Brawl Pass skins'
          git push
